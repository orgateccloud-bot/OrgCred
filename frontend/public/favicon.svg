<!-- Ícone da marca: o "O" de OrgCred como anel no gradiente navy→ciano do DS
     ORGATEC (--oc-grad-cyan de index.css), sobre o navy-900. Substitui o raio
     roxo que veio do template do Vite e não tinha relação nenhuma com a marca.
     É também a fonte dos PNGs de public/icons/ — ver scripts/gerar-icones.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="oc-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0078c0" />
      <stop offset="0.55" stop-color="#00c0f0" />
      <stop offset="1" stop-color="#18e0f8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#021a4d" />
  <circle
    cx="32"
    cy="32"
    r="17"
    fill="none"
    stroke="url(#oc-grad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="88 19"
    transform="rotate(-55 32 32)"
  />
  <circle cx="32" cy="32" r="5.5" fill="#18e0f8" />
</svg>

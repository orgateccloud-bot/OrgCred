[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orgcred"
version = "0.1.0"
description = "OrgCred — módulo de microcrédito ESC (Empresa Simples de Crédito), LC 167/2019"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "ORGATEC", email = "orgatec.cloud@gmail.com"}]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    # Auth & Security
    "supabase==2.1.1",
    "PyJWT==2.8.0",
    "slowapi==0.1.9",
    # Logging & Observability
    "structlog==24.4.0",
    "prometheus-client==0.20.0",
    # Schema migrations
    "alembic==1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "psycopg[binary]==3.2.1",
    "ruff==0.6.9",
    "mypy==1.12.0",
    "bandit==1.7.9",
    "pip-audit==2.6.1",
]


[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/", "__pycache__", ".venv", "venv"]
# alembic/ NÃO é excluído do ruff (só do mypy) — queremos lint/format normal
# nas revisões, apenas sem type-checking estrito nelas.

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # E=errors, F=pyflakes, W=warnings, I=isort
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-after-imports = 2

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["migrations/", "venv/", ".venv/", "tests/", "alembic/"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
# --cov-fail-under: a suíte com banco fica em ~92%; 85 é o piso abaixo do
#   qual a queda é regressão, não ruído. Sem ele o pytest saía 0 mesmo com a
#   suíte inteira em skip. Fora da CI e sem Postgres, tests/conftest.py
#   desliga este piso (medir cobertura de uma suíte que não rodou não diz nada).
# NÃO voltar a colocar --ignore aqui. tests/test_concorrencia.py já foi
#   ignorado (era script standalone psycopg2, com conexão no nível de módulo
#   que quebrava a coleta) e o efeito prático foi a única prova de
#   concorrência do motor de capital ficar fora da suíte por um mês, provando
#   um trigger de três migrations atrás. O arquivo virou módulo pytest normal;
#   ignorar um teste é escondê-lo, não desativá-lo.
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=85"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
omit = [
    "*/site-packages/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orgcred
      POSTGRES_PASSWORD: orgcred_dev_password
      POSTGRES_DB: orgcred_dev
    ports:
      - "5433:5432"
    volumes:
      - orgcred_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgcred -d orgcred_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ORGCRED_DATABASE_URL: postgresql+psycopg://orgcred:orgcred_dev_password@postgres:5432/orgcred_dev
      ORGCRED_ENVIRONMENT: development
      ORGCRED_SUPABASE_JWT_SECRET: dev-secret-key-change-in-prod
      # Identificação da ESC usada como CREDORA no instrumento contratual.
      # Valores FICTÍCIOS de desenvolvimento — em produção vêm do ambiente.
      # O código não tem default: sem estas variáveis, emitir contrato é
      # recusado, e é assim que deve ser (ver app/routers/contratos.py).
      ORGCRED_ESC_RAZAO_SOCIAL: ESC DE DESENVOLVIMENTO LTDA
      ORGCRED_ESC_CNPJ: "00000000000191"
      ORGCRED_ESC_MUNICIPIO: Formoso
      ORGCRED_ESC_UF: GO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  orgcred_pgdata:

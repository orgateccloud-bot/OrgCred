name: CI — Lint, Type-check, Security, Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint-and-type:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format (check)
        run: uv run ruff format --check app tests

      - name: MyPy type-check
        run: uv run mypy app

      - name: Bandit security scan
        run: uv run bandit -r app -ll

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync --all-extras

      # tests/conftest.py cria e migra seu próprio banco isolado por sessão
      # pytest (via ORGCRED_TEST_DATABASE_URL, usada só para descobrir o
      # servidor admin) — não há migration para aplicar manualmente aqui.
      - name: Run pytest
        env:
          ORGCRED_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_JWT_SECRET: ci-test-secret-not-for-production
        run: uv run pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  alembic:
    name: Alembic upgrade/downgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orgcred_alembic_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: alembic upgrade head
        env:
          ORGCRED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orgcred_alembic_ci
        run: uv run alembic upgrade head

      - name: alembic current aponta para 0003
        env:
          ORGCRED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orgcred_alembic_ci
        run: uv run alembic current | grep -q "0003 (head)"

      - name: alembic downgrade base (rollback completo)
        env:
          ORGCRED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orgcred_alembic_ci
        run: uv run alembic downgrade base

  integration:
    name: Integration Tests (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip psycopg2-binary

      - name: Create test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE orgcred_regression;"
        env:
          PGPASSWORD: postgres

      - name: Run regression tests (bash)
        run: |
          chmod +x tests/test_capital_invariant.sh
          ./tests/test_capital_invariant.sh orgcred_regression

      - name: Run concurrency tests (Python)
        run: python tests/test_concorrencia.py orgcred_conc_test
